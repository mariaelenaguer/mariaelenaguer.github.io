# Student evaluations shown on the Teaching page.
# Averages from UCLA's Evaluation of Instruction reports, on a 1-9 scale.
# A rating left out (e.g. knowledge on the instructor form) shows as "–".

# Measures, in order, with the survey question each one reports
# (instructor_question: the wording on the instructor form, if asked there).
columns:
  - key: overall
    label: Overall
    question: "What is your overall rating of the teaching assistant?"
    instructor_question: "Your overall rating of the instructor."
  - key: knowledge
    label: Knowledge
    question: "The T.A. was knowledgeable about the material."
  - key: organization
    label: Organization
    question: "Section presentations were well prepared and organized."
    instructor_question: "Class presentations were well prepared and organized."
  - key: scope
    label: Scope
    question: "The teaching assistant expanded on course ideas."
  - key: communication
    label: Communication
    question: "The teaching assistant had good communication skills."
    instructor_question: "The instructor had good communication skills."
  - key: concern
    label: Concern
    question: "The T.A. was concerned about student learning."
    instructor_question: "The instructor was concerned about student learning."
  - key: interaction
    label: Interaction
    question: "Students felt welcome in seeking help in or outside of the class."
    instructor_question: "Students felt welcome in seeking help in or outside of the class."

